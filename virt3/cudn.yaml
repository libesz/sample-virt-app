apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: vm3-cudn
spec:
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values: ["vm3"]
  network:
    topology: Localnet
    localnet:
      role: Secondary
      physicalNetworkName: vpc-vlans
      ipam:
        mode: Disabled
      vlan:
        mode: Access
        access:
          id: 128
